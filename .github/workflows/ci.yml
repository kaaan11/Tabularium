# Continuous integration: tests on supported Python versions, a non-editable
# wheel smoke test, generated-artifact hygiene, a bounded lint baseline and a
# dependency vulnerability audit. Actions are pinned to release tags.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The sandboxed test runner needs bubblewrap. Ubuntu 24.04 restricts
      # unprivileged user namespaces through AppArmor; lift that for the job.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / true
      - name: Install with all extras
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv -e ".[api,runtime,observability,dev]"
      - name: Full test suite
        # Sandbox tests skip when bwrap is unusable; here that is a failure.
        run: |
          set -o pipefail
          .venv/bin/python -m pytest tests -q -rs | tee pytest.log
          ! grep -q "bwrap isolation unavailable" pytest.log

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build and install a non-editable wheel
        run: |
          uv build --wheel --python 3.12
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl 'pydantic>=2.9,<3'
      - name: Check installed contracts without checkout imports
        run: '"$RUNNER_TEMP/wheel-venv/bin/python" -I tests/wheel_smoke.py'

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No generated artifacts tracked
        run: "! git ls-files | grep -E '(^|/)(__pycache__|build|dist)(/|$)|\\.pyc$|\\.egg-info'"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Bounded baseline: syntax errors and undefined names only (E9, F63, F7,
      # F82). Widen the rule set deliberately, in its own change.
      # Known exceptions, each to be removed once fixed in code:
      # - tabularium/execution.py F821: `Callable` is used in an annotation
      #   but never imported.
      # - tests/test_phase1_i7_explain_engine.py F823: `run_instruction` is
      #   imported locally after a branch that already calls it.
      - name: Ruff (pinned)
        run: >-
          uvx ruff@0.8.6 check
          --select E9,F63,F7,F82
          --config 'lint.per-file-ignores = {"tabularium/execution.py" = ["F821"], "tests/test_phase1_i7_explain_engine.py" = ["F823"]}'
          --output-format github
          tabularium tests

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Resolve the package with every extra, then audit the exact installed
      # versions against the PyPA advisory database. The local package itself
      # is excluded because it is not published from this run.
      - name: Resolve dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv ".[api,runtime,observability,dev]"
          uv pip freeze --python .venv --exclude-editable | grep -v '^tabularium-os' > audit-requirements.txt
      - name: pip-audit (pinned)
        run: uvx pip-audit@2.7.3 --requirement audit-requirements.txt --no-deps --disable-pip --strict
